<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>SA Tricks Admin</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body><header class="header"><a class="brand" href="index.html"><img src="logo.png"><strong>SA Tricks Admin</strong></a><button class="secondary-btn" id="logoutBtn">Logout</button></header>
<main class="admin-wrap"><div id="loginPanel" class="panel"><h1>Admin Login</h1><p class="muted">Only an account marked as admin can manage apps.</p><input id="email" class="input" type="email" placeholder="Admin email"><input id="password" class="input" type="password" placeholder="Password"><button id="loginBtn" class="primary-btn wide">Login</button><div id="loginMsg" class="msg"></div></div>
<div id="dashboard" class="hidden"><div class="admin-top"><div><h1>Dashboard</h1><p class="muted" id="adminEmail"></p></div><a class="secondary-btn" href="index.html">View Website</a></div>
<div class="panel"><h2>Add / Upload App</h2><div class="form-grid"><input id="appName" class="input" placeholder="App name"><input id="appVersion" class="input" placeholder="Version"><input id="appDownloads" class="input" placeholder="Downloads e.g. 12K"><input id="appRating" class="input" placeholder="Rating e.g. 4.8"><label class="file-label">App icon/image<input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp"></label><label class="file-label">APK file<input id="apkFile" type="file" accept=".apk,application/vnd.android.package-archive"></label><label class="check"><input id="popular" type="checkbox"> Popular app</label></div><button id="addAppBtn" class="primary-btn">Upload & Publish App</button><div id="uploadMsg" class="msg"></div></div>
<div class="panel"><div class="section-head"><h2>Published Apps</h2><span id="adminCount"></span></div><div id="adminApps" class="admin-list"></div></div></div></main><script src="admin.js"></script></body></html>
